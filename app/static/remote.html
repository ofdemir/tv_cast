<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg">
<title>TV Cast</title>
<style>
  :root { --bg: #111318; --card: #1b1e26; --line: #2a2e39; --fg: #eceff4; --dim: #8b93a5;
          --accent: #ffb300; --bad: #ff6b6b; --ok: #4cd97b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin-inline: auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--card); color: var(--dim); }
  .chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  input[type=url], input[type=text] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
         background: var(--bg); color: var(--fg); font-size: 16px; }
  button { font: inherit; border: 0; border-radius: 10px; background: #2b303c; color: var(--fg);
           padding: 12px 14px; cursor: pointer; }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); color: #1a1300; font-weight: 700; }
  button:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .mt { margin-top: 10px; }
  details summary { color: var(--dim); font-size: 14px; cursor: pointer; margin-top: 10px; }
  .msg { font-size: 14px; margin-top: 10px; }
  .msg.err { color: var(--bad); } .msg.busy { color: var(--accent); }
  #now .title { font-weight: 600; margin-bottom: 8px; word-break: break-word; }
  #now .meta { color: var(--dim); font-size: 13px; margin-bottom: 8px; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  .times { display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .ctrl button { padding: 14px 0; font-size: 18px; }
  .ctrl button.big { font-size: 24px; }
  .vol { display: flex; align-items: center; gap: 10px; color: var(--dim); }
  #history { list-style: none; padding: 0; margin: 0; }
  #history li { padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
  #history li:first-child { border-top: 0; }
  #history .h-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #history .h-sub { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h2 { font-size: 14px; color: var(--dim); font-weight: 600; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .05em; }
  a.bm { display: inline-block; padding: 8px 12px; background: #2b303c; color: var(--fg); border-radius: 8px; text-decoration: none; }
  code { font-size: 12px; word-break: break-all; color: var(--dim); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>📺 TV Cast</h1>
  <span class="chip bad" id="tvChip">TV bağlı değil</span>
</header>

<form class="card" id="castForm">
  <input type="url" id="url" placeholder="Film/dizi sayfasının linkini yapıştır" required autocomplete="off">
  <details>
    <summary>Gelişmiş</summary>
    <input type="text" id="referer" class="mt" placeholder="Referer (gerekirse, ör. https://site.com/)">
  </details>
  <button class="primary mt" style="width:100%" id="castBtn">TV'de oynat</button>
  <div class="msg" id="msg"></div>
</form>

<section class="card hidden" id="now">
  <div class="title" id="nowTitle"></div>
  <div class="meta" id="nowMeta"></div>
  <input type="range" id="seek" min="0" max="0" step="1" value="0">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="row ctrl mt">
    <button data-rel="-30">-30</button>
    <button data-rel="-10">-10</button>
    <button class="big" id="toggle">▶</button>
    <button data-rel="10">+10</button>
    <button data-rel="30">+30</button>
  </div>
  <div class="row mt">
    <div class="vol"><span>🔈</span><input type="range" id="vol" min="0" max="100" value="100"></div>
  </div>
  <div class="row mt">
    <button id="restart" class="hidden">⏮ Baştan</button>
    <button id="mute">🔇 Ses</button>
    <button id="stop">⏹ Durdur</button>
  </div>
</section>

<section class="card">
  <h2>Son izlenenler</h2>
  <ul id="history"></ul>
</section>

<section class="card">
  <h2>Bilgisayardan tek tıkla gönder</h2>
  <p style="margin:0 0 10px;font-size:14px;color:var(--dim)">
    Aşağıdaki butonu yer imleri çubuğuna sürükle. İzlemek istediğin sayfadayken tıkla.
    Telefonda: yer imi olarak kaydedip adres çubuğuna adını yazarak çalıştırabilirsin.</p>
  <a class="bm" id="bookmarklet" href="#">📺 TV'ye gönder</a>
  <details><summary>Kod</summary><code id="bmCode"></code></details>
</section>

<script src="/static/remote.js"></script>
</body>
</html>
